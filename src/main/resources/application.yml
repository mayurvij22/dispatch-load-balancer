spring:
  application:
    name: dispatch-load-balancer

  # Default profile: in-memory H2. Activate the "postgres" profile for PostgreSQL.
  datasource:
    url: jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          # Group INSERT/UPDATE statements into JDBC batches for bulk uploads
          batch_size: 100
        order_inserts: true
        order_updates: true

  jackson:
    mapper:
      # "high" and "HIGH" are both accepted for the priority field
      accept-case-insensitive-enums: true
    deserialization:
      fail-on-unknown-properties: false

server:
  # Render (and most PaaS hosts) inject the port to bind via $PORT
  port: ${PORT:8080}
  # Honour X-Forwarded-* from the hosting proxy so Swagger UI generates https URLs
  forward-headers-strategy: framework
  error:
    # Never leak stack traces or internal messages to clients
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dispatch: INFO
